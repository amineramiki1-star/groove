<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rhythm Game Controller</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirection
      // This takes whatever path/query was requested and converts it into a hash route
      var l = window.location;
      var redirect = l.protocol + '//' + l.host + '/' + 
        '#/' + l.pathname.slice(1) + 
        (l.search ? '&' + l.search.slice(1) : '') + 
        l.hash;
      window.location.replace(redirect);
    </script>
  </head>

  </body>
</html>
